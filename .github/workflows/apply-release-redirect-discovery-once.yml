name: Apply Release Redirect Discovery Once

on:
  push:
    branches:
      - feature/auto-update

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    if: ${{ github.actor == 'walle-2017' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-update
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Apply redirect discovery and remove obsolete API branches
        shell: pwsh
        run: |
          $previous = git show HEAD^:.github/workflows/apply-release-redirect-discovery-once.yml
          $text = $previous -join "`n"
          $startMarker = "          @'`n"
          $endMarker = "`n          '@ | python -"
          $start = $text.IndexOf($startMarker)
          $end = $text.IndexOf($endMarker, $start + $startMarker.Length)
          if ($start -lt 0 -or $end -lt 0) { throw 'Unable to recover redirect patch from previous workflow revision.' }
          $python = $text.Substring($start + $startMarker.Length, $end - ($start + $startMarker.Length))
          $python = ($python -split "`n" | ForEach-Object { if ($_.StartsWith('          ')) { $_.Substring(10) } else { $_ } }) -join "`n"
          $python | python -

          @'
          from pathlib import Path
          import re

          p = Path('src/updater.rs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    MissingAsset,\n', '')
          s = s.replace('        UpdateError::MissingAsset => "Required Release asset is missing".to_string(),\n', '')
          s = re.sub(r'\n    fn parse_tag\(value: &str\) -> Option<Self> \{\n        Self::parse\(value\.strip_prefix\(\x27v\x27\)\.unwrap_or\(value\)\)\n    \}\n', '\n', s)
          s = re.sub(r'\n    #\[test\]\n    fn leading_v_is_accepted_for_release_tag\(\) \{.*?\n    \}\n', '\n', s, flags=re.S)
          p.write_text(s, encoding='utf-8')

          w = Path('src/window.rs')
          ws = w.read_text(encoding='utf-8')
          ws = ws.replace('\n                            | updater::UpdateError::MissingAsset', '')
          w.write_text(ws, encoding='utf-8')
          '@ | python -

      - name: Verify redirect discovery
        shell: pwsh
        run: |
          ./scripts/assert-auto-update.ps1
          cargo test updater::tests -- --nocapture
          cargo test
          cargo clippy -- -D warnings

      - name: Commit fix and remove one-time workflow
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/apply-release-redirect-discovery-once.yml'
          git config user.name 'walle-2017'
          git config user.email '1220754120@qq.com'
          git add src/updater.rs src/window.rs .github/workflows/apply-release-redirect-discovery-once.yml
          git commit -m 'fix: avoid GitHub API rate limit for update discovery'
          git push origin HEAD:feature/auto-update
