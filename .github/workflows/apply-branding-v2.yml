name: Apply Codex Usage Win branding v2

on:
  push:
    branches:
      - feature/codex-usage-win-branding
    paths:
      - .github/workflows/apply-branding-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/codex-usage-win-branding
          fetch-depth: 0

      - name: Apply rename and compatibility changes
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          # Cargo identity/version.
          text = read('Cargo.toml')
          text = text.replace('version = "1.0.3"', 'version = "1.0.4"', 1)
          text = text.replace('name = "codex-usage"', 'name = "codex-usage-win"', 1)
          text = text.replace('description = "Codex Usage"', 'description = "Codex Usage Win"', 1)
          text = text.replace('ProductName = "Codex Usage"', 'ProductName = "Codex Usage Win"')
          text = text.replace('FileDescription = "Codex Usage"', 'FileDescription = "Codex Usage Win"')
          text = text.replace('OriginalFilename = "codex-usage.exe"', 'OriginalFilename = "codex-usage-win.exe"')
          text = text.replace('InternalName = "CodexUsage"', 'InternalName = "CodexUsageWin"')
          write('Cargo.toml', text)

          text = read('Cargo.lock')
          text, count = re.subn(r'(?m)^name = "codex-usage"\nversion = "1\.0\.3"$', 'name = "codex-usage-win"\nversion = "1.0.4"', text, count=1)
          if count != 1:
              raise SystemExit('Cargo.lock root package block not found')
          write('Cargo.lock', text)

          # Updater identity + backward-compatible one-shot success argument.
          text = read('src/updater.rs')
          text = text.replace('const EXE_ASSET_NAME: &str = "codex-usage.exe";', 'const EXE_ASSET_NAME: &str = "codex-usage-win.exe";')
          text = text.replace('const CHECKSUM_ASSET_NAME: &str = "codex-usage.exe.sha256";', 'const CHECKSUM_ASSET_NAME: &str = "codex-usage-win.exe.sha256";')
          text = text.replace('const UPDATE_SUCCESS_ARG_PREFIX: &str = "--codex-usage-updated-to=";', 'const UPDATE_SUCCESS_ARG_PREFIX: &str = "--codex-usage-win-updated-to=";\nconst LEGACY_UPDATE_SUCCESS_ARG_PREFIX: &str = "--codex-usage-updated-to=";')
          text = text.replace('CodexUsage-Updater/', 'CodexUsageWin-Updater/')
          text = text.replace('codex-usage-update-', 'codex-usage-win-update-')
          text = text.replace('.codex-usage-update-probe-', '.codex-usage-win-update-probe-')
          text = text.replace("$UninstallKey = 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\CodexUsage'", "$UninstallKey = 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\CodexUsageWin'")
          text = text.replace("Join-Path ([string]$Meta.InstallLocation) 'codex-usage.exe'", "Join-Path ([string]$Meta.InstallLocation) 'codex-usage-win.exe'")

          pattern = re.compile(r'''pub\(crate\) fn is_internal_update_arg\(arg: &str\) -> bool \{.*?\n\}\n\nfn successful_update_version_from_iter<I>\(args: I, current_version: &str\) -> Option<String>\nwhere\n    I: IntoIterator<Item = String>,\n\{.*?\n\}\n\npub\(crate\) fn successful_update_version_from_args''', re.S)
          replacement = '''pub(crate) fn is_internal_update_arg(arg: &str) -> bool {
              arg.starts_with(UPDATE_SUCCESS_ARG_PREFIX)
                  || arg.starts_with(LEGACY_UPDATE_SUCCESS_ARG_PREFIX)
          }

          fn successful_update_version_from_iter<I>(args: I, current_version: &str) -> Option<String>
          where
              I: IntoIterator<Item = String>,
          {
              args.into_iter().find_map(|arg| {
                  let version = arg
                      .strip_prefix(UPDATE_SUCCESS_ARG_PREFIX)
                      .or_else(|| arg.strip_prefix(LEGACY_UPDATE_SUCCESS_ARG_PREFIX))?;
                  if Version::parse(version).is_some() && version == current_version {
                      Some(version.to_string())
                  } else {
                      None
                  }
              })
          }

          pub(crate) fn successful_update_version_from_args'''.replace('          ', '')
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('updater success argument functions not found')

          text = text.replace('--codex-usage-updated-to=1.2.3', '--codex-usage-win-updated-to=1.2.3')
          text = text.replace('--codex-usage-updated-to=9.9.9', '--codex-usage-win-updated-to=9.9.9')
          text = text.replace('/codex-usage.exe.sha256"', '/codex-usage-win.exe.sha256"')
          text = text.replace('/codex-usage.exe"', '/codex-usage-win.exe"')
          text = text.replace('  codex-usage.exe"', '  codex-usage-win.exe"')
          text = text.replace(r'C:\Tools\codex-usage.exe', r'C:\Tools\codex-usage-win.exe')
          marker = 'assert!(is_internal_update_arg("--codex-usage-win-updated-to=1.2.3"));'
          if marker in text:
              text = text.replace(marker, marker + '\n        assert!(is_internal_update_arg("--codex-usage-updated-to=1.2.3"));', 1)
          write('src/updater.rs', text)

          # Runtime internal identity. Keep %APPDATA%\\CodexUsage settings unchanged for compatibility.
          text = read('src/window.rs')
          text = text.replace('const STARTUP_REGISTRY_KEY: &str = "CodexUsage";', 'const STARTUP_REGISTRY_KEY: &str = "CodexUsageWin";')
          text = text.replace('const LEGACY_STARTUP_REGISTRY_KEY: &str = "ClaudeCodeUsageMonitor";', 'const LEGACY_STARTUP_REGISTRY_KEY: &str = "CodexUsage";')
          text = text.replace('migrated legacy startup registry entry to CodexUsage', 'migrated legacy startup registry entry to CodexUsageWin')
          text = text.replace('native_interop::wide_str("Global\\\\CodexUsage")', 'native_interop::wide_str("Global\\\\CodexUsageWin")')
          text = text.replace('native_interop::wide_str("CodexUsage")', 'native_interop::wide_str("CodexUsageWin")')
          write('src/window.rs', text)

          text = read('src/diagnose.rs').replace('codex-usage.log', 'codex-usage-win.log')
          write('src/diagnose.rs', text)

          for pth in Path('src/localization').glob('*.rs'):
              if pth.name == 'mod.rs':
                  continue
              text = pth.read_text(encoding='utf-8')
              text = text.replace('window_title: "Codex Usage"', 'window_title: "Codex Usage Win"')
              text = text.replace('update_title: "Codex Usage ', 'update_title: "Codex Usage Win ')
              pth.write_text(text, encoding='utf-8', newline='\n')

          # Installer/uninstaller identities.
          text = read('scripts/install.ps1')
          for old, new in [
              ('Programs\\CodexUsage', 'Programs\\CodexUsageWin'),
              ('codex-usage.exe.sha256', 'codex-usage-win.exe.sha256'),
              ('codex-usage.exe', 'codex-usage-win.exe'),
              ('Codex Usage.lnk', 'Codex Usage Win.lnk'),
              ('Uninstall\\CodexUsage', 'Uninstall\\CodexUsageWin'),
              ("-Name 'CodexUsage'", "-Name 'CodexUsageWin'"),
              ('CodexUsage-Installer', 'CodexUsageWin-Installer'),
              ("DisplayName -Value 'Codex Usage'", "DisplayName -Value 'Codex Usage Win'"),
              ("Shortcut.Description = 'Codex Usage'", "Shortcut.Description = 'Codex Usage Win'"),
              ('Codex Usage $InstalledVersion installed', 'Codex Usage Win $InstalledVersion installed'),
              ('codex-usage-install-', 'codex-usage-win-install-'),
          ]:
              text = text.replace(old, new)
          write('scripts/install.ps1', text)

          text = read('scripts/uninstall.ps1')
          for old, new in [
              ('Programs\\CodexUsage', 'Programs\\CodexUsageWin'),
              ('codex-usage.exe', 'codex-usage-win.exe'),
              ('Codex Usage.lnk', 'Codex Usage Win.lnk'),
              ('Uninstall\\CodexUsage', 'Uninstall\\CodexUsageWin'),
              ("-Name 'CodexUsage'", "-Name 'CodexUsageWin'"),
              ("'Codex Usage was uninstalled.'", "'Codex Usage Win was uninstalled.'"),
          ]:
              text = text.replace(old, new)
          text = text.replace("$SettingsDirectory = Join-Path $env:APPDATA 'CodexUsageWin'", "$SettingsDirectory = Join-Path $env:APPDATA 'CodexUsage'")
          text = text.replace("Join-Path $env:APPDATA 'CodexUsageWin')).TrimEnd", "Join-Path $env:APPDATA 'CodexUsage')).TrimEnd")
          needle = "Remove-ItemProperty -Path $RunKey -Name 'CodexUsageWin' -ErrorAction SilentlyContinue"
          if needle in text and "Remove-ItemProperty -Path $RunKey -Name 'CodexUsage' -ErrorAction SilentlyContinue" not in text:
              text = text.replace(needle, needle + "\n    Remove-ItemProperty -Path $RunKey -Name 'CodexUsage' -ErrorAction SilentlyContinue", 1)
          write('scripts/uninstall.ps1', text)

          # Build/release file names.
          text = read('.github/workflows/release.yml').replace('codex-usage.exe', 'codex-usage-win.exe')
          write('.github/workflows/release.yml', text)
          text = read('.github/workflows/safe-build.yml')
          text = text.replace('Verify v1.0.3 version contract', 'Verify v1.0.4 version contract')
          text = text.replace('target/release/codex-usage.exe', 'target/release/codex-usage-win.exe')
          text = text.replace('dist/codex-usage.exe.sha256', 'dist/codex-usage-win.exe.sha256')
          text = text.replace('dist/codex-usage.exe', 'dist/codex-usage-win.exe')
          text = text.replace('codex-usage-safe-windows-x64', 'codex-usage-win-safe-windows-x64')
          write('.github/workflows/safe-build.yml', text)

          # Regression contracts keep the same safety behavior under the new name/version.
          text = read('scripts/assert-v1-version.ps1')
          text = text.replace("$ExpectedVersion = '1.0.3'", "$ExpectedVersion = '1.0.4'")
          text = text.replace('name\\s*=\\s*"codex-usage"', 'name\\s*=\\s*"codex-usage-win"')
          text = text.replace('Unable to locate codex-usage in Cargo.lock.', 'Unable to locate codex-usage-win in Cargo.lock.')
          text = text.replace('Cargo.lock codex-usage version', 'Cargo.lock codex-usage-win version')
          write('scripts/assert-v1-version.ps1', text)

          text = read('scripts/assert-auto-update.ps1')
          text = text.replace('codex-usage\\.exe\\.sha256', 'codex-usage-win\\.exe\\.sha256')
          text = text.replace('FileDescription\\s*=\\s*"Codex Usage"', 'FileDescription\\s*=\\s*"Codex Usage Win"')
          text = text.replace('concise Codex Usage name', 'Codex Usage Win name')
          text = text.replace('UPDATE_SUCCESS_ARG_PREFIX\\s*:\\s*&str\\s*=\\s*"--codex-usage-updated-to="', 'UPDATE_SUCCESS_ARG_PREFIX\\s*:\\s*&str\\s*=\\s*"--codex-usage-win-updated-to="')
          write('scripts/assert-auto-update.ps1', text)

          text = read('scripts/assert-runtime-log.ps1')
          text = text.replace('codex-usage\\.log', 'codex-usage-win\\.log').replace('codex-usage.log', 'codex-usage-win.log')
          write('scripts/assert-runtime-log.ps1', text)

          # Current user-facing docs only; historical design docs stay historical.
          for p in ['README.md', 'README.zh-CN.md', 'README-FORK.md', 'docs/installation.md', 'docs/troubleshooting.md']:
              text = read(p)
              text = text.replace('Codex Usage', 'Codex Usage Win')
              text = text.replace('codex-usage.exe.sha256', 'codex-usage-win.exe.sha256')
              text = text.replace('codex-usage.exe', 'codex-usage-win.exe')
              text = text.replace('codex-usage.log', 'codex-usage-win.log')
              text = text.replace('--codex-usage-updated-to=', '--codex-usage-win-updated-to=')
              write(p, text)

          text = read('scripts/assert-final-docs.ps1')
          text = text.replace("if (-not $ForkReadme.Contains('1.0.3'))", "if (-not $ForkReadme.Contains('1.0.4'))")
          text = text.replace('current 1.0.3 release', 'current 1.0.4 release')
          text = text.replace('codex-usage.exe.sha256', 'codex-usage-win.exe.sha256')
          text = text.replace('--codex-usage-updated-to=', '--codex-usage-win-updated-to=')
          text = text.replace('codex-usage.log', 'codex-usage-win.log')
          text = text.replace('Codex-only v1.0.3 product state', 'Codex-only v1.0.4 product state')
          write('scripts/assert-final-docs.ps1', text)
          '@ | Set-Content -LiteralPath apply_branding.py -Encoding UTF8
          python apply_branding.py
          Remove-Item apply_branding.py -Force

      - name: Commit branding implementation
        shell: pwsh
        run: |
          git config user.name "walle-2017"
          git config user.email "1220754120@qq.com"
          git add Cargo.toml Cargo.lock src scripts .github/workflows/safe-build.yml .github/workflows/release.yml README.md README.zh-CN.md README-FORK.md docs/installation.md docs/troubleshooting.md
          if (git diff --cached --quiet) { throw 'Branding transform produced no changes.' }
          git commit -m "feat: rename application to Codex Usage Win"
          git push origin HEAD:feature/codex-usage-win-branding
