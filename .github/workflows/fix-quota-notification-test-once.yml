name: Fix Quota Notification Test Once

on:
  push:
    branches:
      - feature/auto-update
    paths:
      - '.github/workflows/fix-quota-notification-test-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-update
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Align quota assertion with concise copy
        shell: pwsh
        run: |
          $path = 'src/window.rs'
          $text = Get-Content -Raw -LiteralPath $path
          $old = 'assert!(alerts[0].message.contains("仅剩 15%"));'
          $new = 'assert!(alerts[0].message.contains("剩余 15%"));'
          if (($text.Split($old).Count - 1) -ne 1) { throw 'Expected exactly one stale quota assertion.' }
          $text = $text.Replace($old, $new)
          Set-Content -LiteralPath $path -Value $text -Encoding utf8NoBOM
          cargo fmt --all

      - name: Verify
        shell: pwsh
        run: |
          ./scripts/assert-auto-update.ps1
          ./scripts/assert-runtime-log.ps1
          ./scripts/assert-no-codex-cli-refresh.ps1
          cargo test
          cargo clippy -- -D warnings
          cargo build --release

      - name: Commit fix and remove one-shot workflow
        shell: pwsh
        run: |
          Remove-Item -LiteralPath .github/workflows/fix-quota-notification-test-once.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align concise quota notification copy"
          git push origin HEAD:feature/auto-update
