name: Fix AssetMissing Match

on:
  push:
    branches:
      - fix/manual-update-on-renamed-assets
    paths:
      - '.github/workflows/fix-assetmissing-match.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-update-on-renamed-assets
          fetch-depth: 0
      - name: Apply source correction
        run: python scripts/fix-assetmissing-match.py
      - name: Commit correction
        shell: pwsh
        run: |
          git restore .github/workflows/fix-assetmissing-match.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: cover missing asset in updater error match"
          git push origin HEAD:fix/manual-update-on-renamed-assets
