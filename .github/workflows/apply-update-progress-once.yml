name: Apply Update Progress Once

on:
  push:
    branches:
      - feature/auto-update
    paths:
      - '.github/workflows/apply-update-progress-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-update

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Apply progress notifications and success marker
        shell: pwsh
        run: |
          @'
