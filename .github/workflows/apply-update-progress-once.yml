name: Apply Update Progress Once

on:
  push:
    branches:
      - feature/auto-update
    paths:
      - '.github/workflows/apply-update-progress-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-update

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Apply progress notifications and success marker
        shell: pwsh
        run: python scripts/apply-update-progress-once.py

      - name: Verify implementation
        shell: pwsh
        run: |
          ./scripts/assert-auto-update.ps1
          ./scripts/assert-runtime-log.ps1
          cargo test
          cargo clippy -- -D warnings

      - name: Commit implementation and remove one-shot files
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/apply-update-progress-once.yml'
          Remove-Item -LiteralPath 'scripts/apply-update-progress-once.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: show Windows notifications during updates'
          git push origin HEAD:feature/auto-update
