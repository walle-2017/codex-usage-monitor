name: Apply Taskbar Layout Small Mode

on:
  push:
    branches:
      - refine-taskbar-layout-small-mode

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-taskbar-layout-small-mode
          fetch-depth: 0

      - name: Apply taskbar refinement patch
        shell: pwsh
        run: ./scripts/apply-taskbar-layout-small-mode.ps1

      - name: Commit source changes
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { throw 'Patch produced no source changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/appearance.rs src/window.rs
          git commit -m 'feat: refine taskbar layout and small-taskbar mode'
          git push origin HEAD:refine-taskbar-layout-small-mode
