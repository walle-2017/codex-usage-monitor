name: Apply Stage2 Cleanup

on:
  push:
    branches:
      - codex-only-v1-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex-only-v1-cleanup
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Apply source cleanup
        shell: pwsh
        run: |
          python scripts/apply-stage2-cleanup.py
          python scripts/fix-stage2-security-feature.py
          python scripts/fix-stage2-clippy.py
          if (Test-Path src/updater.rs) { git rm src/updater.rs }
          if (Test-Path iterations) { git rm -r iterations }
          if (Test-Path packaging/winget) { git rm -r packaging/winget }

      - name: Format
        run: cargo fmt --all

      - name: Verify cleanup contract
        shell: pwsh
        run: ./scripts/assert-clean-codex-only-source.ps1

      - name: Run tests
        run: cargo test

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Build release binary
        run: cargo build --release

      - name: Commit cleanup
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { throw 'Stage2 cleanup produced no changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove dead provider and updater code'
          git push origin HEAD:codex-only-v1-cleanup
