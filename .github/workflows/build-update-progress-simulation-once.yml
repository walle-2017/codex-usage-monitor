name: Build Update Notification Simulation Once

on:
  push:
    branches:
      - feature/auto-update
    paths:
      - '.github/workflows/build-update-progress-simulation-once.yml'

permissions:
  contents: read

jobs:
  build-simulation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-update

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Verify production source and update notification contracts
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw Cargo.toml
          if ($manifest -notmatch '(?m)^version = "1\.0\.2"\r?$') {
            throw 'Expected production source version 1.0.2.'
          }
          ./scripts/assert-auto-update.ps1
          ./scripts/assert-runtime-log.ps1

      - name: Patch version to 1.0.1 in runner only
        shell: pwsh
        run: |
          $path = 'Cargo.toml'
          $text = Get-Content -Raw $path
          $patched = $text -replace '(?m)^version = "1\.0\.2"\r?$', 'version = "1.0.1"'
          if ($patched -eq $text) { throw 'Simulation version patch did not apply.' }
          Set-Content -LiteralPath $path -Value $patched -Encoding utf8NoBOM
          if ((Get-Content -Raw $path) -notmatch '(?m)^version = "1\.0\.1"\r?$') {
            throw 'Simulation manifest is not 1.0.1.'
          }

      - name: Test and lint simulated build
        shell: pwsh
        run: |
          cargo test updater::tests -- --nocapture
          cargo clippy -- -D warnings

      - name: Build simulated v1.0.1 executable
        shell: pwsh
        run: cargo build --release

      - name: Verify PE version and prepare artifact
        shell: pwsh
        run: |
          $exe = Resolve-Path 'target/release/codex-usage.exe'
          $version = (Get-Item $exe).VersionInfo.FileVersion
          if ($version -notmatch '^1\.0\.1(?:\.0)?$') {
            throw "Expected simulated PE FileVersion 1.0.1, got: $version"
          }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $exe artifact/codex-usage.exe
          $hash = (Get-FileHash artifact/codex-usage.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  codex-usage.exe" | Set-Content artifact/codex-usage.exe.sha256 -Encoding ascii
          @"
          UPDATE NOTIFICATION END-TO-END SIMULATION
          Source branch: feature/auto-update
          Source commit: $env:GITHUB_SHA
          Simulated current version: 1.0.1
          Expected discovered Release: v1.0.2
          Expected final official v1.0.2 SHA256:
          33a2e08a6d7bc3f42bdf1de2a9a1c6cd82ff6d891a80e274e6951335d5eda428

          Expected Windows notifications before replacement:
          - checking for updates
          - new version found / downloading and verifying
          - update ready / restarting to v1.0.2

          The downloaded official v1.0.2 predates the new success-marker consumer,
          so the post-restart success notification cannot appear in this simulation.
          That one-shot marker behavior is covered by unit tests and will work when
          updating between releases that both contain the new updater implementation.
          "@ | Set-Content artifact/SIMULATION-INFO.txt -Encoding utf8
          Write-Host "simulation_exe_sha256=$hash"
          Write-Host "simulation_pe_version=$version"

      - uses: actions/upload-artifact@v4
        with:
          name: codex-usage-update-notification-simulation-x64
          path: artifact/*
          if-no-files-found: error
