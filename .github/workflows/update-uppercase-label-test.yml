name: Update Uppercase Label Test

on:
  push:
    branches:
      - fix-compact-layout-clipping

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-compact-layout-clipping
          fetch-depth: 0
      - name: Update uppercase label test
        shell: pwsh
        run: ./scripts/update-uppercase-label-test.ps1
      - name: Commit test update
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { throw 'Test update produced no changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/poller.rs
          git commit -m 'test: expect uppercase taskbar quota labels'
          git push origin HEAD:fix-compact-layout-clipping
