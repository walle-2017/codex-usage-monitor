name: Sync v1.0.1 Lock

on:
  push:
    branches:
      - v1.0.1-live-drag
    paths:
      - '.github/workflows/sync-v101-lock.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.1-live-drag
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh root package lock version
        run: cargo check
      - name: Commit Cargo.lock only
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet && throw 'Cargo.lock did not change.'
          git diff --cached --exit-code -- . ':(exclude)Cargo.lock'
          git commit -m "chore: sync Cargo.lock for v1.0.1"
          git push origin HEAD:v1.0.1-live-drag
