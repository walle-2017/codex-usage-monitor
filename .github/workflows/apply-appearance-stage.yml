name: Apply Appearance Stage

on:
  push:
    branches:
      - appearance-presets

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: appearance-presets
          fetch-depth: 0
      - name: Apply appearance patch stage
        shell: pwsh
        run: ./scripts/apply-appearance-stage.ps1
      - name: Commit generated source change
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/window.rs src/appearance.rs README-FORK.md
            git commit -m "feat: refine taskbar quota visuals"
            git push origin HEAD:appearance-presets
          } else {
            Write-Host "No source changes to commit."
          }
