name: Cleanup Appearance Warnings

on:
  push:
    branches:
      - appearance-presets

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: appearance-presets
          fetch-depth: 0

      - name: Remove obsolete appearance constants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $appearance = Get-Content -Raw src/appearance.rs
          $appearance = $appearance.Replace("    pub const ALL: [Self; 3] = [Self::Default, Self::Compact, Self::Minimal];`n`n", "")
          Set-Content -Path src/appearance.rs -Value $appearance -Encoding utf8NoBOM

          $window = Get-Content -Raw src/window.rs
          $obsolete = @(
            'const DIVIDER_RIGHT_MARGIN: i32 = 10;',
            'const LABEL_WIDTH: i32 = 18;',
            'const LABEL_RIGHT_MARGIN: i32 = 10;',
            'const BAR_RIGHT_MARGIN: i32 = 4;',
            'const TEXT_WIDTH: i32 = 62;',
            'const SIMPLIFIED_CHINESE_LABEL_WIDTH: i32 = 20;',
            'const SIMPLIFIED_CHINESE_TEXT_WIDTH: i32 = 126;',
            'const MODEL_RIGHT_MARGIN: i32 = 3;',
            'const WIDGET_HEIGHT: i32 = 46;'
          )
          foreach ($line in $obsolete) {
            if (-not $window.Contains($line)) {
              throw "Expected obsolete constant not found: $line"
            }
            $window = $window.Replace("$line`n", "")
          }
          Set-Content -Path src/window.rs -Value $window -Encoding utf8NoBOM

      - name: Commit cleanup
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/appearance.rs src/window.rs
            git commit -m "chore: remove obsolete appearance constants"
            git push origin HEAD:appearance-presets
          } else {
            throw "Cleanup produced no source changes."
          }
