name: Cleanup Appearance Warnings

on:
  push:
    branches:
      - appearance-presets

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: appearance-presets
          fetch-depth: 0

      - name: Remove obsolete appearance constants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $appearancePath = 'src/appearance.rs'
          $appearance = Get-Content -Raw $appearancePath
          $appearancePattern = '(?m)^\s*pub const ALL: \[Self; 3\] = \[Self::Default, Self::Compact, Self::Minimal\];\r?\n'
          $appearanceUpdated = [regex]::Replace($appearance, $appearancePattern, '', 1)
          if ($appearanceUpdated -eq $appearance) {
            throw 'Expected AppearancePreset::ALL constant was not removed.'
          }
          Set-Content -Path $appearancePath -Value $appearanceUpdated -Encoding utf8NoBOM -NoNewline

          $windowPath = 'src/window.rs'
          $window = Get-Content -Raw $windowPath
          $obsoleteNames = @(
            'DIVIDER_RIGHT_MARGIN',
            'LABEL_WIDTH',
            'LABEL_RIGHT_MARGIN',
            'BAR_RIGHT_MARGIN',
            'TEXT_WIDTH',
            'SIMPLIFIED_CHINESE_LABEL_WIDTH',
            'SIMPLIFIED_CHINESE_TEXT_WIDTH',
            'MODEL_RIGHT_MARGIN',
            'WIDGET_HEIGHT'
          )
          foreach ($name in $obsoleteNames) {
            $pattern = "(?m)^const ${name}: i32 = [^;]+;\r?\n"
            $updated = [regex]::Replace($window, $pattern, '', 1)
            if ($updated -eq $window) {
              throw "Expected obsolete constant not removed: $name"
            }
            $window = $updated
          }
          Set-Content -Path $windowPath -Value $window -Encoding utf8NoBOM -NoNewline

          $remaining = Select-String -Path $appearancePath,$windowPath -Pattern 'pub const ALL:|DIVIDER_RIGHT_MARGIN|LABEL_WIDTH|LABEL_RIGHT_MARGIN|BAR_RIGHT_MARGIN|TEXT_WIDTH|SIMPLIFIED_CHINESE_LABEL_WIDTH|SIMPLIFIED_CHINESE_TEXT_WIDTH|MODEL_RIGHT_MARGIN|WIDGET_HEIGHT'
          if ($remaining) {
            $remaining | ForEach-Object { Write-Error $_.Line }
            throw 'Obsolete warning symbols remain after cleanup.'
          }

          git diff --check

      - name: Commit cleanup
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/appearance.rs src/window.rs
            git commit -m "chore: remove obsolete appearance constants"
            git push origin HEAD:appearance-presets
          } else {
            throw "Cleanup produced no source changes."
          }
