name: Test Live Taskbar Drag

on:
  push:
    branches:
      - v1.0.1-live-drag

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live cross-taskbar dragging
        shell: pwsh
        run: ./scripts/assert-drag-handler-safe.ps1
