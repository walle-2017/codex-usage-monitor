name: Apply Taskbar UI Fixes

on:
  push:
    branches:
      - taskbar-drag-ui-fixes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: taskbar-drag-ui-fixes
          fetch-depth: 0

      - name: Update fork documentation
        shell: pwsh
        run: ./scripts/apply-taskbar-ui-fixes.ps1

      - name: Commit documentation
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { throw 'Documentation update produced no changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README-FORK.md
          git commit -m 'docs: update taskbar interaction notes'
          git push origin HEAD:taskbar-drag-ui-fixes
