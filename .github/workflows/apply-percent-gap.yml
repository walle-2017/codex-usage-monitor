name: Apply Percentage Gap

on:
  push:
    branches:
      - add-percent-gap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-percent-gap
          fetch-depth: 0

      - name: Apply percentage gap patch
        shell: pwsh
        run: ./scripts/apply-percent-gap.ps1

      - name: Commit source patch
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { throw 'Patch produced no source changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/window.rs
          git commit -m 'feat: add spacing before percentage value'
          git push origin HEAD:add-percent-gap
