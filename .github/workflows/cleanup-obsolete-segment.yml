name: Cleanup Obsolete Segment Constant

on:
  push:
    branches:
      - taskbar-drag-ui-fixes

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: taskbar-drag-ui-fixes
          fetch-depth: 0

      - name: Remove obsolete segment constant
        shell: pwsh
        run: ./scripts/cleanup-obsolete-segment.ps1

      - name: Commit cleanup
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { throw 'Cleanup produced no source changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/window.rs
          git commit -m 'chore: remove obsolete segment count constant'
          git push origin HEAD:taskbar-drag-ui-fixes
