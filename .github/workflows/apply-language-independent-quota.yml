name: Apply Language-Independent Quota

on:
  push:
    branches:
      - fix-language-independent-remaining-quota

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-language-independent-remaining-quota
          fetch-depth: 0

      - name: Apply quota semantics patch
        shell: pwsh
        run: ./scripts/apply-language-independent-quota.ps1

      - name: Commit quota semantics fix
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { throw 'Patch produced no source changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/appearance.rs src/window.rs
          git commit -m 'fix: make remaining quota language independent'
          git push origin HEAD:fix-language-independent-remaining-quota
