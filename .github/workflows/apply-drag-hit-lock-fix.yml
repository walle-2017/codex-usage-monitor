name: Apply Drag Hit Lock Fix

on:
  push:
    branches:
      - refine-taskbar-layout-small-mode

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-taskbar-layout-small-mode
          fetch-depth: 0

      - name: Apply drag hit-test patch
        shell: pwsh
        run: ./scripts/apply-drag-hit-lock-fix.ps1

      - name: Commit source fix
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { throw 'Patch produced no source changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/window.rs
          git commit -m 'fix: avoid reentrant lock in drag hit testing'
          git push origin HEAD:refine-taskbar-layout-small-mode
