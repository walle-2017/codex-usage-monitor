name: Apply Concise Notification UX Once

on:
  push:
    branches:
      - feature/auto-update
    paths:
      - '.github/workflows/apply-notification-ux-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-update
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Apply approved notification UX
        run: python scripts/apply-notification-ux.py

      - name: Format and verify
        shell: pwsh
        run: |
          cargo fmt --all
          ./scripts/assert-auto-update.ps1
          ./scripts/assert-runtime-log.ps1
          ./scripts/assert-no-codex-cli-refresh.ps1
          cargo test
          cargo clippy -- -D warnings

      - name: Commit implementation and remove one-shot files
        shell: pwsh
        run: |
          Remove-Item -LiteralPath scripts/apply-notification-ux.py -Force
          Remove-Item -LiteralPath .github/workflows/apply-notification-ux-once.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: streamline Windows notifications"
          git push origin HEAD:feature/auto-update
