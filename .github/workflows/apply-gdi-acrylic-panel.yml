name: Apply GDI Acrylic Panel

on:
  push:
    branches:
      - gdi-acrylic-panel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gdi-acrylic-panel
          fetch-depth: 0

      - name: Apply acrylic panel patch
        shell: pwsh
        run: ./scripts/apply-gdi-acrylic-panel.ps1

      - name: Commit source patch
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { throw 'Patch produced no source changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/appearance.rs src/window.rs
          git commit -m 'feat: add acrylic-style panel and dotted drag handle'
          git push origin HEAD:gdi-acrylic-panel
