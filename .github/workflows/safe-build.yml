name: Safe Windows Build

on:
  push:
    branches:
      - main
      - safe-no-codex-cli
      - codex-only-v1-cleanup
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Codex CLI refresh is disabled
        shell: pwsh
        run: ./scripts/assert-no-codex-cli-refresh.ps1

      - name: Verify Codex-only runtime
        shell: pwsh
        run: ./scripts/assert-codex-only-runtime.ps1

      - name: Verify taskbar drag capture handling
        shell: pwsh
        run: ./scripts/assert-drag-handler-safe.ps1

      - name: Verify compact taskbar UI contract
        shell: pwsh
        run: ./scripts/assert-compact-ui.ps1

      - name: Verify small-taskbar UI contract
        shell: pwsh
        run: ./scripts/assert-small-taskbar-ui.ps1

      - name: Verify language-independent quota semantics
        shell: pwsh
        run: ./scripts/assert-language-independent-quota.ps1

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/codex-usage.exe dist/codex-usage.exe
          $hash = (Get-FileHash -Algorithm SHA256 dist/codex-usage.exe).Hash.ToLowerInvariant()
          "$hash  codex-usage.exe" | Set-Content -Encoding ascii dist/codex-usage.exe.sha256

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-usage-safe-windows-x64
          path: |
            dist/codex-usage.exe
            dist/codex-usage.exe.sha256
          if-no-files-found: error
