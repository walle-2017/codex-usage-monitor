name: Apply Stage1 Codex Only

on:
  push:
    branches:
      - codex-only-v1-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex-only-v1-cleanup
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply stage1 patch
        run: |
          python scripts/apply-stage1-codex-only.py
          python scripts/fix-stage1-main.py

      - name: Format
        run: cargo fmt --all

      - name: Check compile
        run: cargo check

      - name: Commit stage1 runtime cleanup
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { throw 'Stage1 patch produced no changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'refactor: make runtime Codex only'
          git push origin HEAD:codex-only-v1-cleanup
