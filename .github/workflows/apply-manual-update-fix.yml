name: Apply Manual Update Fallback Fix

on:
  push:
    branches:
      - fix/manual-update-on-renamed-assets
    paths:
      - '.github/workflows/apply-manual-update-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-update-on-renamed-assets
          fetch-depth: 0

      - name: Apply exact source changes
        run: python scripts/apply-manual-update-fix.py

      - name: Verify regression contract before commit
        shell: pwsh
        run: ./scripts/assert-v103-update-compat.ps1

      - name: Commit implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: fall back to manual update when release assets are renamed"
          git push origin HEAD:fix/manual-update-on-renamed-assets
