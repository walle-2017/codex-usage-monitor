name: Apply Render Layered Deadlock Fix

on:
  push:
    branches:
      - hotfix-render-layered-deadlock

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-render-layered-deadlock
          fetch-depth: 0

      - name: Apply render deadlock patch
        shell: pwsh
        run: ./scripts/apply-render-layered-deadlock-fix.ps1

      - name: Commit source fix
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { throw 'Patch produced no source changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/window.rs
          git commit -m 'fix: avoid startup reentrant state lock'
          git push origin HEAD:hotfix-render-layered-deadlock
