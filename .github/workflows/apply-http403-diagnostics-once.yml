name: Apply HTTP 403 Diagnostics Once

on:
  push:
    branches:
      - feature/auto-update

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    if: ${{ github.actor == 'walle-2017' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-update
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Apply bounded HTTP diagnostics
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          p = Path('src/updater.rs')
          s = p.read_text(encoding='utf-8')

          old = '''fn ureq_error_detail(error: &ureq::Error) -> String {
              match error {
                  ureq::Error::Status(status, _) => format!("HTTP {status}"),
                  ureq::Error::Transport(transport) => format!("network/TLS: {}", safe_detail(transport)),
              }
          }
          '''
          new = '''fn diagnostic_body_summary(content_type: Option<&str>, body: &str) -> (Option<String>, Option<String>) {
              let sanitized = safe_detail(body);
              let is_json = content_type
                  .map(|value| value.to_ascii_lowercase().contains("json"))
                  .unwrap_or(false);
              let body_message = if is_json {
                  serde_json::from_str::<serde_json::Value>(body)
                      .ok()
                      .and_then(|value| value.get("message").and_then(|message| message.as_str()).map(safe_detail))
              } else {
                  None
              };
              let body_preview = if body_message.is_none() && !sanitized.is_empty() {
                  Some(sanitized)
              } else {
                  None
              };
              (body_message, body_preview)
          }

          fn github_status_detail(status: u16, response: ureq::Response) -> String {
              let header_names = [
                  "X-RateLimit-Limit",
                  "X-RateLimit-Remaining",
                  "X-RateLimit-Reset",
                  "X-RateLimit-Resource",
                  "Retry-After",
                  "Server",
                  "Content-Type",
              ];
              let content_type = response.header("Content-Type").map(str::to_string);
              let mut parts = vec![format!("HTTP {status}")];
              for name in header_names {
                  if let Some(value) = response.header(name) {
                      parts.push(format!("{}={}", name.to_ascii_lowercase(), safe_detail(value)));
                  }
              }

              let mut body = String::new();
              let mut reader = response.into_reader().take(4096);
              let _ = reader.read_to_string(&mut body);
              let (body_message, body_preview) = diagnostic_body_summary(content_type.as_deref(), &body);
              if let Some(message) = body_message {
                  parts.push(format!("body_message={message}"));
              } else if let Some(preview) = body_preview {
                  parts.push(format!("body_preview={preview}"));
              }
              parts.join(" ")
          }

          fn ureq_error_detail(error: ureq::Error) -> String {
              match error {
                  ureq::Error::Status(status, response) => github_status_detail(status, response),
                  ureq::Error::Transport(transport) => format!("network/TLS: {}", safe_detail(transport)),
              }
          }
          '''
          if old not in s:
              raise SystemExit('ureq_error_detail block not found')
          s = s.replace(old, new)
          s = s.replace('ureq_error_detail(&error)', 'ureq_error_detail(error)')

          marker = '''    #[test]\n    fn malformed_version_is_rejected() {'''
          tests = '''    #[test]
              fn json_http_error_extracts_message_without_preview() {
                  let (message, preview) = diagnostic_body_summary(
                      Some("application/json; charset=utf-8"),
                      r#"{"message":"API rate limit exceeded"}"#,
                  );
                  assert_eq!(message.as_deref(), Some("API rate limit exceeded"));
                  assert!(preview.is_none());
              }

              #[test]
              fn non_json_http_error_keeps_bounded_sanitized_preview() {
                  let (message, preview) = diagnostic_body_summary(
                      Some("text/html"),
                      "proxy denied https://user:secret@example.com/request",
                  );
                  assert!(message.is_none());
                  let preview = preview.expect("preview");
                  assert!(preview.contains("<redacted>@example.com"));
                  assert!(!preview.contains("secret"));
              }

          '''
          if marker not in s:
              raise SystemExit('test insertion marker not found')
          s = s.replace(marker, tests + marker)
          p.write_text(s, encoding='utf-8')
          '@ | python -

      - name: Verify diagnostics
        shell: pwsh
        run: |
          ./scripts/assert-auto-update.ps1
          cargo test updater::tests -- --nocapture
          cargo clippy -- -D warnings

      - name: Commit fix and remove one-time workflow
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/apply-http403-diagnostics-once.yml'
          git config user.name 'walle-2017'
          git config user.email '1220754120@qq.com'
          git add src/updater.rs .github/workflows/apply-http403-diagnostics-once.yml
          git commit -m 'fix: expose GitHub HTTP failure diagnostics'
          git push origin HEAD:feature/auto-update
