name: Apply Compact Layout Fix

on:
  push:
    branches:
      - fix-compact-layout-clipping

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-compact-layout-clipping
          fetch-depth: 0

      - name: Apply compact layout fix
        shell: pwsh
        run: ./scripts/apply-compact-layout-fix.ps1

      - name: Commit compact layout fix
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { throw 'Patch produced no source changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/window.rs src/localization/simplified_chinese.rs
          git commit -m 'fix: correct compact quota layout and labels'
          git push origin HEAD:fix-compact-layout-clipping
